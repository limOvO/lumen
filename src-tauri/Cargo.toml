[package]
name = "lumen"
version = "0.1.0"
edition = "2021"
description = "Lumen — lightweight image viewer & annotator"
authors = ["Lumen"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

kamadak-exif = "0.6"
imagesize = "0.13"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
