[package]
name = "lumen-egui-app"
version = "0.3.0"
edition = "2021"
description = "Lumen rewritten in Rust + wgpu + egui (no WebView)"

[[bin]]
name = "lumen-egui-app"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["wgpu", "default_fonts", "x11"] }
egui = "0.32"
wgpu = { version = "25", default-features = false, features = ["vulkan", "gles"] }
gtk = "0.18"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
kamadak-exif = "0.6"
tiny-skia = "0.11"
ab_glyph = "0.2"
webp = "0.3"

[profile.release]
# Size-first profile: ~9.5 MB binary (was ~15.2 MB). The hot decode path is
# system libjpeg-turbo, so the opt-level=z penalty is limited to Rust-side image
# resizing/encoding. Verified with scripts/parity/verify.py + bench-egui.sh.
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
